<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caption Editor — ClipFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@500;600&family=JetBrains+Mono:wght@400;500;600&family=Montserrat:wght@600;700;800;900&family=Poppins:wght@600;700;800;900&family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="captions.css" />
  </head>
  <body class="caption-editor-page">
    <!-- ─── TOPBAR ─────────────────────────────────────────── -->
    <header class="ce-topbar" id="ceTopbar">
      <div class="ce-topbar-left">
        <button class="ce-back-btn" id="backBtn" type="button">
          <span class="ce-back-arrow">←</span>
          <span>Back</span>
        </button>
        <div class="ce-topbar-divider"></div>
        <div class="ce-topbar-title-block">
          <span class="ce-kicker">Caption Editor</span>
          <strong class="ce-clip-title" id="clipTitleDisplay"
            >Selected Clip</strong
          >
        </div>
      </div>

      <div class="ce-topbar-center">
        <div class="ce-status-chip">
          <span class="ce-status-dot"></span>
          <span class="ce-status-label">Live Sync</span>
        </div>
      </div>

      <div class="ce-topbar-right">
        <label class="ce-theme-toggle" aria-label="Toggle theme">
          <input type="checkbox" id="themeToggle" />
          <span class="ce-toggle-track">
            <span class="ce-toggle-thumb"></span>
          </span>
          <span class="ce-toggle-label" id="modePill">Light</span>
        </label>
        <button
          class="ce-btn ce-btn--primary"
          id="saveAndBackBtn"
          type="button"
        >
          Save &amp; Return
        </button>
      </div>
    </header>

    <main class="ce-shell">
      <!-- ─── NO CLIP STATE ─────────────────────────────────── -->
      <div id="noClipState" class="ce-empty-state" style="display: none">
        <div class="ce-empty-icon">
          <svg
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              d="M15 10l4.553-2.069A1 1 0 0121 8.87v6.26a1 1 0 01-1.447.9L15 14M3 8a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"
            />
          </svg>
        </div>
        <h3 class="ce-empty-title">No clip selected</h3>
        <p class="ce-empty-sub">
          Go back to the studio and open a generated clip in the caption editor.
        </p>
        <button class="ce-btn ce-btn--primary" id="goBackBtn" type="button">
          Go to Studio
        </button>
      </div>

      <!-- ─── EDITOR SHELL ───────────────────────────────────── -->
      <div class="ce-layout" id="editorShell">
        <!-- LEFT: PREVIEW PANEL -->
        <aside class="ce-preview-panel">
          <div class="ce-phone-stage">
            <!-- iPhone 16-inspired frame -->
            <div class="ce-phone-frame">
              <div class="ce-phone-bezel">
                <div class="ce-phone-notch">
                  <div class="ce-phone-island"></div>
                </div>
                <div class="ce-phone-screen">
                  <div class="caption-video-wrap" id="captionVideoWrap">
                    <video
                      id="captionVideo"
                      class="caption-editor-video"
                      controls
                      playsinline
                      preload="metadata"
                    ></video>
                    <div class="caption-video-overlay" id="captionOverlay">
                      <span
                        class="caption-video-text"
                        id="captionOverlayText"
                      ></span>
                    </div>
                  </div>
                </div>
                <div class="ce-phone-home-bar"></div>
              </div>
              <!-- Side buttons -->
              <div class="ce-phone-btn ce-phone-btn--vol-up"></div>
              <div class="ce-phone-btn ce-phone-btn--vol-down"></div>
              <div class="ce-phone-btn ce-phone-btn--power"></div>
            </div>
          </div>

          <div class="ce-preview-meta">
            <div class="ce-meta-item">
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 6 12 12 16 14" />
              </svg>
              <span>Real-time overlay</span>
            </div>
            <div class="ce-meta-dot"></div>
            <div class="ce-meta-item">
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
              <span>Export ready</span>
            </div>
          </div>
        </aside>

        <!-- RIGHT: WORKSPACE -->
        <section class="ce-workspace">
          <!-- Workspace top bar -->
          <div class="ce-workspace-topbar">
            <div
              class="ce-tab-switcher"
              role="tablist"
              aria-label="Caption editor panels"
            >
              <button
                class="ce-tab is-active"
                id="timelineTabBtn"
                type="button"
                role="tab"
                aria-selected="true"
                data-tab="timeline"
              >
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                >
                  <line x1="3" y1="6" x2="21" y2="6" />
                  <line x1="3" y1="12" x2="21" y2="12" />
                  <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
                Timeline
              </button>
              <button
                class="ce-tab"
                id="styleTabBtn"
                type="button"
                role="tab"
                aria-selected="false"
                data-tab="style"
              >
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                >
                  <circle cx="13.5" cy="6.5" r="2.5" />
                  <circle cx="6.5" cy="12" r="2.5" />
                  <circle cx="13.5" cy="17.5" r="2.5" />
                </svg>
                Style Controls
              </button>
            </div>

            <div class="ce-timeline-actions" id="timelineActions">
              <span class="ce-timeline-label">Timeline</span>
              <button
                class="ce-btn ce-btn--ghost ce-btn--sm"
                id="addSegmentBtn"
                type="button"
              >
                <svg
                  width="13"
                  height="13"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                >
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                Add
              </button>
              <button
                class="ce-btn ce-btn--ghost ce-btn--sm"
                id="regenerateCaptionsBtn"
                type="button"
              >
                <svg
                  width="13"
                  height="13"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                >
                  <polyline points="23 4 23 10 17 10" />
                  <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                </svg>
                Regenerate
              </button>
            </div>
          </div>

          <!-- ─── TIMELINE PANEL ─────────────────────────────── -->
          <section
            class="caption-tab-panel is-active"
            id="timelinePanel"
            data-panel="timeline"
            aria-hidden="false"
          >
            <div id="captionLoadingState" class="ce-loading-card">
              <div class="ce-loading-ring"></div>
              <div class="caption-loading-copy">Generating captions…</div>
            </div>

            <div
              class="caption-segments-list"
              id="captionSegmentsList"
              style="display: none"
            ></div>
          </section>

          <!-- ─── STYLE PANEL ────────────────────────────────── -->
          <section
            class="caption-tab-panel"
            id="stylePanel"
            data-panel="style"
            aria-hidden="true"
            hidden
          >

            <div class="caption-style-groups ce-style-grid">
              <!-- 1. TYPOGRAPHY -->
              <section class="ce-card" style="grid-area: typography">
                <div class="ce-card-head">
                  <h4 class="ce-card-title">Typography</h4>
                </div>

                <div class="ce-field">
                  <label class="ce-label" for="capFontFamily"
                    >Font Family</label
                  >
                  <div class="ce-select-wrap">
                    <select id="capFontFamily" class="ce-select">
                      <option value="'Montserrat', sans-serif">
                        Montserrat
                      </option>
                      <option value="Inter, sans-serif">Inter</option>
                      <option value="'Poppins', sans-serif">Poppins</option>
                      <option value="'Oswald', sans-serif">Oswald</option>
                      <option value="Georgia, serif">Georgia</option>
                      <option value="'Courier New', monospace">
                        Courier New
                      </option>
                      <option value="'Arial Black', sans-serif">
                        Arial Black
                      </option>
                      <option value="Impact, sans-serif">Impact</option>
                    </select>
                    <span class="ce-select-caret">⌄</span>
                  </div>
                </div>

                <div class="ce-field">
                  <label class="ce-label" for="capFontSize">
                    Font Size —
                    <strong><span id="capFontSizeVal">28</span>px</strong>
                  </label>
                  <input
                    class="ce-range"
                    type="range"
                    id="capFontSize"
                    min="14"
                    max="72"
                    value="28"
                  />
                </div>

                <div class="ce-field">
                  <label class="ce-label" for="capAnimStyle"
                    >Word Animation</label
                  >
                  <div class="ce-select-wrap">
                    <select id="capAnimStyle" class="ce-select">
                      <option value="none">None — Static</option>
                      <option value="classic">Classic — Fade</option>
                      <option value="elevate">Elevate — Float Up</option>
                      <option value="reveal">Reveal — Blur Fade</option>
                      <option value="highlight">Highlight — Bold Pop</option>
                      <option value="neon">Neon — Glow</option>
                      <option value="cinematic">Cinematic — Film Strip</option>
                      <option value="pop">Pop — Bounce In</option>
                      <option value="typewriter">Typewriter — Step In</option>
                      <option value="oneword">One Word — Show One</option>
                      <option value="twoword">Two Word — Show Two</option>
                      <option value="wordcolor">
                        Word Color — Color Change
                      </option>
                      <option value="wordappend">
                        Word Append — Append In
                      </option>
                      <option value="highlightimpact">
                        Highlight Impact — Impactful Word
                      </option>
                    </select>
                    <span class="ce-select-caret">⌄</span>
                  </div>
                </div>
              </section>

              <!-- 2. COLORS -->
              <section class="ce-card" style="grid-area: colors">
                <div class="ce-card-head">
                  <h4 class="ce-card-title">Colors</h4>
                </div>

                <div class="ce-color-block">
                  <div class="ce-color-row">
                    <label class="ce-label" for="capTextColor">Text</label>
                    <input
                      type="color"
                      id="capTextColor"
                      class="ce-color-input"
                      value="#ffffff"
                    />
                  </div>
                  <div class="ce-swatches">
                    <button
                      class="color-swatch-btn"
                      type="button"
                      data-target="capTextColor"
                      data-value="#ffffff"
                      style="--sw: #ffffff"
                      title="White"
                    ></button>
                    <button
                      class="color-swatch-btn"
                      type="button"
                      data-target="capTextColor"
                      data-value="#111111"
                      style="--sw: #111111"
                      title="Black"
                    ></button>
                    <button
                      class="color-swatch-btn"
                      type="button"
                      data-target="capTextColor"
                      data-value="#F5D76E"
                      style="--sw: #f5d76e"
                      title="Gold"
                    ></button>
                    <button
                      class="color-swatch-btn"
                      type="button"
                      data-target="capTextColor"
                      data-value="#90CDF4"
                      style="--sw: #90cdf4"
                      title="Sky"
                    ></button>
                    <button
                      class="color-swatch-btn"
                      type="button"
                      data-target="capTextColor"
                      data-value="#4ade80"
                      style="--sw: #4ade80"
                      title="Green"
                    ></button>
                    <button
                      class="color-swatch-btn"
                      type="button"
                      data-target="capTextColor"
                      data-value="#00ffff"
                      style="--sw: #00ffff"
                      title="Cyan"
                    ></button>
                    <button
                      class="color-swatch-btn"
                      type="button"
                      data-target="capTextColor"
                      data-value="#F6A6C1"
                      style="--sw: #f6a6c1"
                      title="Blush"
                    ></button>
                  </div>
                </div>

                <div class="ce-color-block">
                  <div class="ce-color-row">
                    <label class="ce-label" for="capBgColor">Background</label>
                    <input
                      type="color"
                      id="capBgColor"
                      class="ce-color-input"
                      value="#000000"
                    />
                  </div>
                  <div class="ce-swatches">
                    <button
                      class="color-swatch-btn"
                      type="button"
                      data-target="capBgColor"
                      data-value="#000000"
                      style="--sw: #000000"
                      title="Black"
                    ></button>
                    <button
                      class="color-swatch-btn"
                      type="button"
                      data-target="capBgColor"
                      data-value="#ffffff"
                      style="--sw: #ffffff"
                      title="White"
                    ></button>
                    <button
                      class="color-swatch-btn"
                      type="button"
                      data-target="capBgColor"
                      data-value="#1a1a2e"
                      style="--sw: #1a1a2e"
                      title="Navy"
                    ></button>
                    <button
                      class="color-swatch-btn"
                      type="button"
                      data-target="capBgColor"
                      data-value="#2B2B35"
                      style="--sw: #2b2b35"
                      title="Slate"
                    ></button>
                    <button
                      class="color-swatch-btn"
                      type="button"
                      data-target="capBgColor"
                      data-value="#F5D76E"
                      style="--sw: #f5d76e"
                      title="Gold"
                    ></button>
                    <button
                      class="color-swatch-btn"
                      type="button"
                      data-target="capBgColor"
                      data-value="#e53e3e"
                      style="--sw: #e53e3e"
                      title="Red"
                    ></button>
                    <button
                      class="color-swatch-btn"
                      type="button"
                      data-target="capBgColor"
                      data-value="#0a0a0a"
                      style="--sw: #0a0a0a"
                      title="Near-black"
                    ></button>
                  </div>
                </div>

                <div class="ce-field">
                  <label class="ce-label" for="capBgOpacity">
                    Opacity —
                    <strong><span id="capBgOpacityVal">70</span>%</strong>
                  </label>
                  <input
                    class="ce-range"
                    type="range"
                    id="capBgOpacity"
                    min="0"
                    max="100"
                    value="70"
                  />
                </div>
              </section>

              <!-- 3. PRESETS -->
              <section class="ce-card" style="grid-area: presets">
                <div class="ce-card-head">
                  <h4 class="ce-card-title">Style Presets</h4>
                  <span class="ce-hint"
                    >Tap to apply — fully replaces current style</span
                  >
                </div>
                <div class="presets-grid" id="presetsGrid"></div>
              </section>

              <!-- 4. PLACEMENT -->
              <section class="ce-card" style="grid-area: placement">
                <div class="ce-card-head">
                  <h4 class="ce-card-title">Placement</h4>
                </div>
                <label class="ce-label">Caption Position</label>
                <div class="ce-position-group" id="positionBtns">
                  <button class="duration-btn" data-pos="top" type="button">
                    <svg
                      width="14"
                      height="14"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <rect x="3" y="3" width="18" height="18" rx="2" />
                      <line x1="3" y1="9" x2="21" y2="9" />
                    </svg>
                    Top
                  </button>
                  <button
                    class="duration-btn active"
                    data-pos="bottom"
                    type="button"
                  >
                    <svg
                      width="14"
                      height="14"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <rect x="3" y="3" width="18" height="18" rx="2" />
                      <line x1="3" y1="15" x2="21" y2="15" />
                    </svg>
                    Bottom
                  </button>
                  <button class="duration-btn" data-pos="center" type="button">
                    <svg
                      width="14"
                      height="14"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <rect x="3" y="3" width="18" height="18" rx="2" />
                      <line x1="3" y1="12" x2="21" y2="12" />
                    </svg>
                    Center
                  </button>
                </div>
              </section>

              <!-- 5. SHADOW -->
              <section class="ce-card" style="grid-area: shadow">
                <div class="ce-card-head">
                  <h4 class="ce-card-title">Shadow</h4>
                </div>

                <label class="ce-toggle-row">
                  <input type="checkbox" id="capTextShadow" checked />
                  <span class="ce-mini-track"
                    ><span class="ce-mini-thumb"></span
                  ></span>
                  <span class="ce-toggle-text">Enable Text Shadow</span>
                </label>

                <div class="shadow-controls-grid" id="shadowControlsGrid">
                  <div
                    class="ce-color-block ce-shadow-color-block"
                    style="grid-column: 1/-1"
                  >
                    <div class="ce-color-row">
                      <label class="ce-label" for="capShadowColor"
                        >Shadow Color</label
                      >
                      <input
                        type="color"
                        id="capShadowColor"
                        class="ce-color-input"
                        value="#000000"
                      />
                    </div>
                    <div class="ce-swatches">
                      <button
                        class="color-swatch-btn"
                        type="button"
                        data-target="capShadowColor"
                        data-value="#000000"
                        style="--sw: #000000"
                      ></button>
                      <button
                        class="color-swatch-btn"
                        type="button"
                        data-target="capShadowColor"
                        data-value="#ffffff"
                        style="--sw: #ffffff"
                      ></button>
                      <button
                        class="color-swatch-btn"
                        type="button"
                        data-target="capShadowColor"
                        data-value="#222831"
                        style="--sw: #222831"
                      ></button>
                      <button
                        class="color-swatch-btn"
                        type="button"
                        data-target="capShadowColor"
                        data-value="#6B46C1"
                        style="--sw: #6b46c1"
                      ></button>
                      <button
                        class="color-swatch-btn"
                        type="button"
                        data-target="capShadowColor"
                        data-value="#00bcd4"
                        style="--sw: #00bcd4"
                      ></button>
                      <button
                        class="color-swatch-btn"
                        type="button"
                        data-target="capShadowColor"
                        data-value="#22c55e"
                        style="--sw: #22c55e"
                      ></button>
                      <button
                        class="color-swatch-btn"
                        type="button"
                        data-target="capShadowColor"
                        data-value="#C53030"
                        style="--sw: #c53030"
                      ></button>
                    </div>
                  </div>

                  <div class="ce-field">
                    <label class="ce-label" for="capShadowBlur">
                      Blur —
                      <strong><span id="capShadowBlurVal">8</span>px</strong>
                    </label>
                    <input
                      class="ce-range"
                      type="range"
                      id="capShadowBlur"
                      min="0"
                      max="30"
                      value="8"
                    />
                  </div>

                  <div class="ce-field">
                    <label class="ce-label" for="capShadowOffsetX"
                      >Offset X</label
                    >
                    <input
                      class="ce-input-num"
                      type="number"
                      id="capShadowOffsetX"
                      min="-20"
                      max="20"
                      value="0"
                    />
                  </div>

                  <div class="ce-field">
                    <label class="ce-label" for="capShadowOffsetY"
                      >Offset Y</label
                    >
                    <input
                      class="ce-input-num"
                      type="number"
                      id="capShadowOffsetY"
                      min="-20"
                      max="20"
                      value="2"
                    />
                  </div>
                </div>
              </section>

              <!-- 6. ACTIONS -->
              
            </div>
            <!-- /ce-style-grid -->
          </section>
          <!-- /stylePanel -->
        </section>
        <!-- /ce-workspace -->
      </div>
      <!-- /ce-layout -->
    </main>
    <script src="captions.js"></script>
  </body>
</html>
