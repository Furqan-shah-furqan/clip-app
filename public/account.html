<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your account · ClipFlow Studio</title><link rel="stylesheet" href="/customer.css"><script src="/customer.js" defer></script></head><body class="customer-page"><header><a href="/">CF <span>ClipFlow <small>STUDIO</small></span></a><button id="themeButton" type="button" aria-label="Switch color theme">Day / Night</button></header><main><section class="customer-card"><p class="eyebrow">CLIPFLOW STUDIO</p><h1 id="formTitle">Welcome back</h1><p class="muted" id="formDescription">Your clips. Your accounts. Your workspace.</p><div class="tabs" role="group" aria-label="Account action"><button type="button" data-mode="login" aria-pressed="true">Sign in</button><button type="button" data-mode="register" aria-pressed="false">Create account</button></div><form id="accountForm"><label id="nameLabel" hidden>Name<input id="name" autocomplete="name" maxlength="80"></label><label id="emailLabel">Email<input id="email" type="email" autocomplete="username" required maxlength="254"></label><label id="passwordLabel">Password<input id="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required><small>At least 12 characters</small></label><button class="primary" id="submitButton">Sign in</button></form><p id="formStatus" role="status" aria-live="polite"></p><button class="text-button" id="forgotButton" type="button">Forgot password?</button><a id="backLogin" href="/account.html" hidden>Back to sign in</a></section></main></body></html>
