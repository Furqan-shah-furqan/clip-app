services:
  # Service A: Express Web API & UI Service
  - type: web
    name: clipflow-studio
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: WHISPER_MODEL
        value: base
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_HOST
        value: youtube-video-fast-downloader-24-7.p.rapidapi.com
      - key: YOUTUBE_API_KEY
        sync: false

  # Service B: Independent BullMQ Clip-Generation Background Worker
  - type: worker
    name: clipflow-worker
    env: docker
    dockerfilePath: Dockerfile
    dockerCommand: npm run worker:generation
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHISPER_MODEL
        value: base
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        fromService:
          type: web
          name: clipflow-studio
          envVarKey: TOKEN_ENCRYPTION_KEY
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_HOST
        value: youtube-video-fast-downloader-24-7.p.rapidapi.com
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GENERATION_WORKER_CONCURRENCY
        value: 1
      - key: SMART_REFRAME_TIMEOUT_MS
        value: 25000
      - key: YOUTUBE_SOURCE_DOWNLOAD_TIMEOUT_MS
        value: 600000
