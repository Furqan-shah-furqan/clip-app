services:
  # Single Free Web Service running both Express API and Generation Worker via supervisor
  - type: web
    name: clipflow-studio
    env: docker
    dockerfilePath: Dockerfile
    dockerCommand: npm run start:render
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: WHISPER_MODEL
        value: base
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_HOST
        value: youtube-video-fast-downloader-24-7.p.rapidapi.com
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GENERATION_WORKER_CONCURRENCY
        value: 1
      - key: SMART_REFRAME_TIMEOUT_MS
        value: 25000
      - key: YOUTUBE_SOURCE_DOWNLOAD_TIMEOUT_MS
        value: 600000
